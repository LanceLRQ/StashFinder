[package]
name = "stashfinder-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
stashfinder-core = { path = "../core" }
uuid = { version = "=1.29.0", features = ["v4"] }
rusqlite = { version = "=0.41.1", features = ["bundled", "functions"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_bytes = "=0.11.19"
rmp-serde = "=1.3.1"
crc32fast = "=1.5.4"
tempfile.workspace = true
windows.workspace = true

[lints]
workspace = true

[features]
query-bench = []

[[bin]]
name = "query-baseline"
path = "src/bin/query-baseline.rs"
required-features = ["query-bench"]
