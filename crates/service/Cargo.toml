[package]
name = "stashfinder-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
stashfinder-core = { path = "../core" }
stashfinder-windows = { path = "../windows" }
stashfinder-store = { path = "../store" }
windows-service = "=0.8.1"
tokio.workspace = true
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
anyhow.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
rusqlite = { version = "=0.41.1", features = ["bundled"] }

[features]
memory-index-bench = ["stashfinder-store/memory-index-bench"]
deferred-mft-bench = ["memory-index-bench", "stashfinder-windows/mft-prototype"]

[lints]
workspace = true
